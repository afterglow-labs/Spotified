services:
  spotified:
    image: spotified:local
    build: .
    container_name: spotified
    entrypoint: ["spotified-server"]
    command: ["--host", "0.0.0.0", "--config-dir", "/config"]
    ports:
      - "127.0.0.1:8088:8088"
      - "127.0.0.1:4381:4381"
    environment:
      SPOTIFIED_SERVER_NAME: "This Mac · Docker"
    volumes:
      - ./.spotified/docker:/config
      - "${HOME}/Music/Spotified Music:/root/Music/Spotified Music"
      - "${HOME}/Music/Spotified Podcasts:/root/Music/Spotified Podcasts"
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
