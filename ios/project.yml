name: Spotified
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 2J5W72TTU5
    MARKETING_VERSION: 0.6.1
    CURRENT_PROJECT_VERSION: 10
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Spotified:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afterglowlabs.spotified.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Spotified
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Connect to your private Spotified music server.
        ITSAppUsesNonExemptEncryption: false
  SpotifiedTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{target: Spotified}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afterglowlabs.spotified.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  SpotifiedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{target: Spotified}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afterglowlabs.spotified.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Spotified:
    build:
      targets:
        Spotified: all
    test:
      targets: [SpotifiedTests, SpotifiedUITests]
