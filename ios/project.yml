name: Spotified
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 2J5W72TTU5
    MARKETING_VERSION: 0.7.0
    CURRENT_PROJECT_VERSION: 11
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  Ogg:
    url: https://github.com/sbooth/ogg-binary-xcframework
    exactVersion: 0.1.3
  Vorbis:
    url: https://github.com/sbooth/vorbis-binary-xcframework
    exactVersion: 0.1.2
targets:
  Spotified:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - {package: Ogg, product: ogg}
      - {package: Vorbis, product: vorbis}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afterglowlabs.spotified.ios
        SWIFT_OBJC_BRIDGING_HEADER: Sources/VorbisAsset.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Spotified
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Connect to your private Spotified music server.
        ITSAppUsesNonExemptEncryption: false
  SpotifiedTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{target: Spotified}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afterglowlabs.spotified.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  SpotifiedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{target: Spotified}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afterglowlabs.spotified.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Spotified:
    build:
      targets:
        Spotified: all
    test:
      targets: [SpotifiedTests, SpotifiedUITests]
